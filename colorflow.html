<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Flow</title>
    <style>
        :root {
            --green-dark: #0a1f11;
            --green-base: #11331c;
            --green-primary: #1ab047;
            --green-light: #2ee66a;
            --green-glow: rgba(46, 230, 106, 0.5);
            --text-light: #eefdf2;
            --bg-glass: rgba(17, 51, 28, 0.6);
            --border-glass: rgba(46, 230, 106, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, var(--green-base), var(--green-dark));
            overflow: hidden;
            color: var(--text-light);
        }

        /* Screen Management */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 10;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        /* Background Graphics */
        .bg-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Home Screen */
        #home-screen {
            z-index: 20;
        }

        .title-container {
            text-align: center;
            margin-bottom: 50px;
            animation: float 4s ease-in-out infinite;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, var(--green-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--green-primary);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .play-btn {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--green-light), var(--green-primary));
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                0 15px 35px rgba(0,0,0,0.4),
                inset 0 4px 10px rgba(255,255,255,0.4),
                0 0 30px var(--green-glow);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .play-btn:active {
            transform: scale(0.95);
            box-shadow:
                0 10px 25px rgba(0,0,0,0.4),
                inset 0 2px 5px rgba(255,255,255,0.4),
                0 0 15px var(--green-glow);
        }

        .play-btn svg {
            width: 80px;
            height: 80px;
            fill: white;
            margin-left: 10px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        /* Top HUD / Settings */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 30;
            pointer-events: none;
        }

        .hud-left, .hud-right {
            pointer-events: auto;
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            width: 45px;
            height: 45px;
            border-radius: 15px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s, background 0.2s;
            color: white;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--green-light);
            stroke-width: 2;
            fill: none;
        }

        .wallet-container {
            display: flex;
            align-items: center;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 5px 15px 5px 5px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }

        .coin-icon {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border: 2px solid #fff9c4;
        }

        .coin-amount {
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffd700;
        }

        /* Game Screen */
        #game-screen {
            z-index: 25;
            background: radial-gradient(circle at 50% 50%, var(--green-base), var(--green-dark));
        }

        .game-header {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: auto;
            z-index: 30;
        }

        .level-info {
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: var(--bg-glass);
            padding: 5px 15px;
            border-radius: 15px;
            border: 1px solid var(--border-glass);
            color: var(--green-light);
        }

        #game-canvas {
            touch-action: none;
            width: 100vmin;
            height: 100vmin;
            max-width: 600px;
            max-height: 600px;
            margin-top: 50px; /* Offset for header */
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 20px;
            background: rgba(0,0,0,0.2);
            position: relative;
            z-index: 28;
        }

        .celebration {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px var(--green-light), 0 5px 10px rgba(0,0,0,0.5);
            z-index: 40;
            opacity: 0;
            pointer-events: none;
        }

        .celebration.active {
            animation: popInAndOut 2s ease-out forwards;
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes popInAndOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        .settings-panel {
            position: absolute;
            top: 75px;
            right: 20px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transform: scale(0);
            transform-origin: top right;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 35;
        }

        .settings-panel.open {
            transform: scale(1);
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 150px;
            font-weight: bold;
            color: var(--green-light);
        }

        .toggle-btn {
            width: 40px;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-btn.on {
            background: var(--green-primary);
        }

        .toggle-knob {
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }

        .toggle-btn.on .toggle-knob {
            transform: translateX(20px);
        }

    </style>
</head>
<body>

    <!-- Background Animation Canvas -->
    <canvas id="bg-canvas" class="bg-particles"></canvas>

    <!-- Global HUD -->
    <div class="hud">
        <div class="hud-left">
            <div class="wallet-container">
                <div class="coin-icon">C</div>
                <div class="coin-amount" id="coin-display">0</div>
            </div>
        </div>
        <div class="hud-right">
            <div class="icon-btn" id="btn-settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settings-panel">
        <div class="setting-row">
            <span>Sound</span>
            <div class="toggle-btn on" id="toggle-sound">
                <div class="toggle-knob"></div>
            </div>
        </div>
        <div class="setting-row">
            <span>Music</span>
            <div class="toggle-btn on" id="toggle-music">
                <div class="toggle-knob"></div>
            </div>
        </div>
    </div>

    <!-- Home Screen -->
    <div id="home-screen" class="screen">
        <div class="title-container">
            <div class="title">Color Flow</div>
            <div class="subtitle">Connect the Dots</div>
        </div>
        <button class="play-btn" id="btn-play">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen hidden">
        <div class="game-header">
            <div class="icon-btn" id="btn-back">
                <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </div>
            <div class="level-info" id="level-display">Level 1</div>
            <!-- Invisible spacer to center the level title correctly given the back button -->
            <div style="width: 45px;"></div>
        </div>

        <div style="position:relative;">
            <canvas id="game-canvas"></canvas>
            <div class="celebration" id="celebration-text">PERFECT!</div>
        </div>
    </div>

<script>
/**
 * Color Flow - Premium 100% Working HTML5 Canvas Game
 */

// ==== STATE & CONFIG ====
const CONFIG = {
    colors: [
        '#ff3b30', '#ff9500', '#ffcc00', '#4cd964', '#5ac8fa',
        '#007aff', '#5856d6', '#ff2d55', '#a2845e', '#8e8e93',
        '#00ff00', '#00ffff', '#ff00ff'
    ],
    gridPadding: 15,
    cellPadding: 4,
    particleCount: 50,
    baseScore: 10,
    fps: 60
};

let STATE = {
    screen: 'home',
    level: 1,
    coins: 0,
    sound: true,
    music: true,
    gridSize: 4,
    grid: [], // 1D array of cells: null or {colorId, isEndpoint, pathId}
    endpoints: [], // {x, y, colorId}
    paths: [], // Array of path arrays [{x, y}]
    activePath: null, // Index of currently drawing path
    activeColorId: null,
    isDrawing: false,
    solved: false,
    bestScore: 0
};

// ==== AUDIO SYNTHESIS ====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let bgmOscillator = null;

const playTone = (freq, type, duration, vol) => {
    if (!STATE.sound || audioCtx.state === 'suspended') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
};

const playSound = (name) => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    switch(name) {
        case 'click': playTone(600, 'sine', 0.1, 0.5); break;
        case 'connect': playTone(800, 'sine', 0.1, 0.4); playTone(1200, 'sine', 0.15, 0.4); break;
        case 'win':
            [400, 500, 600, 800].forEach((f, i) => {
                setTimeout(() => playTone(f, 'square', 0.2, 0.3), i * 100);
            });
            break;
        case 'error': playTone(200, 'sawtooth', 0.2, 0.5); break;
    }
};

const manageBGM = () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (STATE.music) {
        if (!bgmOscillator) {
            // Very soft ambient background
            bgmOscillator = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            bgmOscillator.type = 'sine';
            bgmOscillator.frequency.value = 100;

            // LFO for modulation
            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 0.2;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 20;
            lfo.connect(lfoGain);
            lfoGain.connect(bgmOscillator.frequency);

            gain.gain.value = 0.02;
            bgmOscillator.connect(gain);
            gain.connect(audioCtx.destination);

            bgmOscillator.start();
            lfo.start();
            bgmOscillator.gainNode = gain;
        } else {
            bgmOscillator.gainNode.gain.value = 0.02;
        }
    } else {
        if (bgmOscillator) {
            bgmOscillator.gainNode.gain.value = 0;
        }
    }
};

// ==== STORAGE ====
const loadState = () => {
    const saved = localStorage.getItem('colorflow_save');
    if (saved) {
        const parsed = JSON.parse(saved);
        STATE.level = parsed.level || 1;
        STATE.coins = parsed.coins || 0;
        STATE.bestScore = parsed.bestScore || 0;
        STATE.sound = parsed.sound !== undefined ? parsed.sound : true;
        STATE.music = parsed.music !== undefined ? parsed.music : true;
    }
    updateUI();
};

const saveState = () => {
    localStorage.setItem('colorflow_save', JSON.stringify({
        level: STATE.level,
        coins: STATE.coins,
        bestScore: STATE.bestScore,
        sound: STATE.sound,
        music: STATE.music
    }));
};

// ==== LEVEL GENERATION ====
// Generates a random fully covered solvable grid
const generateLevel = (size) => {
    const w = size, h = size;
    let paths = [];

    // We attempt to fill the grid with paths
    // A simple robust algorithm: start from unvisited cells, grow a path randomly.
    // Then merge short paths to make fewer, longer paths.

    for (let attempts = 0; attempts < 1000; attempts++) {
        let empty = new Set();
        for(let i=0; i<w*h; i++) empty.add(i);
        paths = [];

        const getNeighbors = (idx) => {
            let x = idx % w, y = Math.floor(idx / w);
            let n = [];
            if (x > 0) n.push(idx - 1);
            if (x < w - 1) n.push(idx + 1);
            if (y > 0) n.push(idx - w);
            if (y < h - 1) n.push(idx + w);
            return n;
        };

        while(empty.size > 0) {
            // Find cell with fewest empty neighbors
            let minN = 999, start = -1;
            for(let c of empty) {
                let count = getNeighbors(c).filter(x => empty.has(x)).length;
                if(count < minN) { minN = count; start = c; }
            }

            let path = [start];
            empty.delete(start);
            let head = start;

            while(true) {
                let neighbors = getNeighbors(head).filter(n => empty.has(n));
                if(neighbors.length === 0) break;
                // Prefer neighbor with fewest empty neighbors to avoid isolated cells
                neighbors.sort((a,b) => {
                    let na = getNeighbors(a).filter(x => empty.has(x)).length;
                    let nb = getNeighbors(b).filter(x => empty.has(x)).length;
                    return na - nb;
                });
                // Pick one of the best randomly
                let minVal = getNeighbors(neighbors[0]).filter(x => empty.has(x)).length;
                let bestN = neighbors.filter(x => getNeighbors(x).filter(y => empty.has(y)).length === minVal);
                let next = bestN[Math.floor(Math.random() * bestN.length)];

                path.push(next);
                empty.delete(next);
                head = next;
            }
            paths.push(path);
        }

        // Connect paths fully to cover grid with as few paths as possible
        let merged = true;
        while(merged) {
            merged = false;
            for(let i=0; i<paths.length; i++) {
                let p1 = paths[i];
                let ep1 = [p1[0], p1[p1.length-1]];
                let found = false;
                for(let j=0; j<paths.length; j++) {
                    if(i === j) continue;
                    let p2 = paths[j];
                    let ep2 = [p2[0], p2[p2.length-1]];

                    for(let e1 of ep1) {
                        for(let e2 of ep2) {
                            if(getNeighbors(e1).includes(e2)) {
                                if(e1 === p1[0]) p1.reverse();
                                if(e2 === p2[p2.length-1]) p2.reverse();
                                paths[i] = p1.concat(p2);
                                paths.splice(j, 1);
                                found = true; merged = true;
                                break;
                            }
                        }
                        if(found) break;
                    }
                    if(found) break;
                }
                if(found) break;
            }
        }

        // Now split paths into appropriate number of colors
        let targetColors = Math.max(3, Math.floor(size * 1.2));
        if (size >= 8) targetColors = Math.max(4, Math.floor(size * 1.1));

        let finalPaths = [];
        let numColorsToCut = Math.max(0, targetColors - paths.length);

        for (let p of paths) {
            if (numColorsToCut > 0 && p.length > numColorsToCut * 2) {
                let cutPoints = new Set();
                let failsafe = 0;
                while(cutPoints.size < numColorsToCut && failsafe < 100) {
                    failsafe++;
                    let cut = 1 + Math.floor(Math.random() * (p.length - 2));
                    let ok = true;
                    for (let cp of cutPoints) {
                        if (Math.abs(cp - cut) < 2) { ok = false; break; }
                    }
                    if (ok) cutPoints.add(cut);
                }

                let sortedCuts = Array.from(cutPoints).sort((a,b)=>a-b);
                let startIdx = 0;
                for (let c of sortedCuts) {
                    finalPaths.push(p.slice(startIdx, c));
                    startIdx = c;
                }
                finalPaths.push(p.slice(startIdx));
                numColorsToCut -= cutPoints.size;
            } else {
                finalPaths.push(p);
            }
        }
        paths = finalPaths;

        // Ensure all paths have length >= 2
        if (paths.every(p => p.length >= 2) && paths.length >= 2 && paths.length <= CONFIG.colors.length) {
            break;
        }
    }

    // Fallback if loop finishes without finding a perfect fit, just use paths

    // Map paths to endpoints and grid
    STATE.endpoints = [];
    paths.forEach((p, idx) => {
        let p1 = p[0];
        let p2 = p[p.length-1];
        STATE.endpoints.push({x: p1 % w, y: Math.floor(p1 / w), colorId: idx});
        STATE.endpoints.push({x: p2 % w, y: Math.floor(p2 / w), colorId: idx});
    });

    // Shuffle endpoints to shuffle color mapping
    let colorMap = [...Array(paths.length).keys()].sort(() => Math.random() - 0.5);
    STATE.endpoints.forEach(ep => ep.colorId = colorMap[ep.colorId]);
};

const initLevel = () => {
    STATE.solved = false;
    STATE.isDrawing = false;
    STATE.activePath = null;

    // Determine grid size based on level (max 9x9)
    let s = 4 + Math.floor((STATE.level - 1) / 5);
    STATE.gridSize = Math.min(s, 9);

    generateLevel(STATE.gridSize);

    // Init state grid
    STATE.grid = Array(STATE.gridSize * STATE.gridSize).fill(null);
    STATE.paths = [];
    for(let i=0; i<CONFIG.colors.length; i++) STATE.paths.push([]);

    // Mark endpoints in grid
    STATE.endpoints.forEach(ep => {
        STATE.grid[ep.y * STATE.gridSize + ep.x] = { colorId: ep.colorId, isEndpoint: true, pathId: null };
    });

    document.getElementById('level-display').innerText = `Level ${STATE.level}`;
    resizeCanvas();
};

// ==== CANVAS & RENDER ====
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cellSize = 0;
let renderLoop;
let particles = [];

const resizeCanvas = () => {
    let p = canvas.parentNode;
    let size = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.7, 600);
    canvas.style.width = `${size}px`;
    canvas.style.height = `${size}px`;

    // Use devicePixelRatio for crisp rendering
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.scale(dpr, dpr);

    // Calculate cell size
    const totalPadding = CONFIG.gridPadding * 2;
    cellSize = (size - totalPadding) / STATE.gridSize;
};

// Helper to get screen coordinates of grid cell
const getCellCoords = (x, y) => {
    return {
        cx: CONFIG.gridPadding + x * cellSize + cellSize / 2,
        cy: CONFIG.gridPadding + y * cellSize + cellSize / 2
    };
};

const drawGrid = () => {
    // Background
    ctx.fillStyle = '#11331c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw cells (subtle background for empty cells)
    const padding = CONFIG.cellPadding;
    for (let y = 0; y < STATE.gridSize; y++) {
        for (let x = 0; x < STATE.gridSize; x++) {
            let cx = CONFIG.gridPadding + x * cellSize;
            let cy = CONFIG.gridPadding + y * cellSize;

            ctx.fillStyle = 'rgba(26, 176, 71, 0.05)';
            ctx.beginPath();
            ctx.roundRect(cx + padding, cy + padding, cellSize - padding*2, cellSize - padding*2, 10);
            ctx.fill();

            ctx.strokeStyle = 'rgba(26, 176, 71, 0.1)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }
};

const drawPaths = () => {
    STATE.paths.forEach((path, colorId) => {
        if (path.length === 0) return;

        const color = CONFIG.colors[colorId];

        ctx.beginPath();
        let startC = getCellCoords(path[0].x, path[0].y);
        ctx.moveTo(startC.cx, startC.cy);

        for (let i = 1; i < path.length; i++) {
            let c = getCellCoords(path[i].x, path[i].y);
            ctx.lineTo(c.cx, c.cy);
        }

        // Glow effect
        ctx.shadowBlur = 15;
        ctx.shadowColor = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = cellSize * 0.3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Inner bright line
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = cellSize * 0.1;
        ctx.stroke();
    });
};

const drawEndpoints = () => {
    STATE.endpoints.forEach(ep => {
        const c = getCellCoords(ep.x, ep.y);
        const color = CONFIG.colors[ep.colorId];
        const radius = cellSize * 0.35;

        // Check if connected
        let isConnected = STATE.paths[ep.colorId].length > 1 &&
            ((STATE.paths[ep.colorId][0].x === ep.x && STATE.paths[ep.colorId][0].y === ep.y) ||
             (STATE.paths[ep.colorId][STATE.paths[ep.colorId].length-1].x === ep.x && STATE.paths[ep.colorId][STATE.paths[ep.colorId].length-1].y === ep.y));
        let fullyConnected = STATE.paths[ep.colorId].length > 1;
        if(fullyConnected) {
             let p = STATE.paths[ep.colorId];
             let pStart = p[0], pEnd = p[p.length-1];
             let ep1 = STATE.endpoints.find(e => e.colorId === ep.colorId && e !== ep);
             fullyConnected = ((pStart.x === ep.x && pStart.y === ep.y && pEnd.x === ep1.x && pEnd.y === ep1.y) ||
                               (pEnd.x === ep.x && pEnd.y === ep.y && pStart.x === ep1.x && pStart.y === ep1.y));
        }

        // Shadow
        ctx.shadowBlur = fullyConnected ? 20 : 10;
        ctx.shadowColor = color;

        // Outer dot
        ctx.beginPath();
        ctx.arc(c.cx, c.cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Inner highlight for 3D effect
        const grad = ctx.createRadialGradient(c.cx - radius*0.3, c.cy - radius*0.3, radius*0.1, c.cx, c.cy, radius);
        grad.addColorStop(0, 'rgba(255,255,255,0.8)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fill();

        // If connected, draw a little check or bright center
        if (fullyConnected) {
            ctx.beginPath();
            ctx.arc(c.cx, c.cy, radius * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fill();
        }
    });
};

const drawParticles = () => {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        p.size *= 0.95;

        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }

        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1.0;
};

const render = () => {
    if (STATE.screen !== 'game') return;
    drawGrid();
    drawPaths();
    drawEndpoints();
    drawParticles();
    renderLoop = requestAnimationFrame(render);
};

// ==== INPUT HANDLING ====
const getGridPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    // Scale coords
    const x = clientX - rect.left;
    const y = clientY - rect.top;

    // Actual canvas CSS size
    const scale = canvas.width / (window.devicePixelRatio || 1) / canvas.clientWidth;
    const mappedX = x * scale;
    const mappedY = y * scale;

    const gridX = Math.floor((mappedX - CONFIG.gridPadding) / cellSize);
    const gridY = Math.floor((mappedY - CONFIG.gridPadding) / cellSize);

    if (gridX >= 0 && gridX < STATE.gridSize && gridY >= 0 && gridY < STATE.gridSize) {
        return {x: gridX, y: gridY};
    }
    return null;
};

const handleStart = (e) => {
    if (STATE.solved) return;
    const pos = getGridPos(e);
    if (!pos) return;

    const idx = pos.y * STATE.gridSize + pos.x;
    const cell = STATE.grid[idx];

    if (cell) {
        // If touching an endpoint or an existing path
        STATE.activeColorId = cell.colorId;
        STATE.isDrawing = true;

        // Truncate path up to this point
        let path = STATE.paths[STATE.activeColorId];
        let pIdx = path.findIndex(p => p.x === pos.x && p.y === pos.y);

        if (pIdx !== -1) {
            // Cut path
            let removed = path.splice(pIdx + 1);
            removed.forEach(r => {
                let rIdx = r.y * STATE.gridSize + r.x;
                if (!STATE.grid[rIdx].isEndpoint) {
                    STATE.grid[rIdx] = null;
                }
            });
        } else if (cell.isEndpoint) {
            // Start from endpoint, clear old path
            let removed = path.splice(0);
            removed.forEach(r => {
                let rIdx = r.y * STATE.gridSize + r.x;
                if (!STATE.grid[rIdx].isEndpoint) {
                    STATE.grid[rIdx] = null;
                }
            });
            path.push({x: pos.x, y: pos.y});
        }
        playSound('click');
    }
};

const handleMove = (e) => {
    if (!STATE.isDrawing || STATE.solved) return;
    // Prevent scrolling
    if (e.cancelable) e.preventDefault();

    const pos = getGridPos(e);
    if (!pos) return;

    let path = STATE.paths[STATE.activeColorId];
    if (path.length === 0) return;

    let lastPos = path[path.length - 1];

    // Check if moved to a new adjacent cell
    if (pos.x !== lastPos.x || pos.y !== lastPos.y) {
        let dx = Math.abs(pos.x - lastPos.x);
        let dy = Math.abs(pos.y - lastPos.y);

        // Only allow movement up/down/left/right by 1 cell
        if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
            const idx = pos.y * STATE.gridSize + pos.x;
            const targetCell = STATE.grid[idx];

            // If target cell is empty, add to path
            if (!targetCell) {
                path.push({x: pos.x, y: pos.y});
                STATE.grid[idx] = { colorId: STATE.activeColorId, isEndpoint: false, pathId: STATE.activeColorId };
                spawnParticles(pos.x, pos.y, CONFIG.colors[STATE.activeColorId], 2);
            }
            // If target is our own path (backtracking)
            else if (targetCell.colorId === STATE.activeColorId) {
                let pIdx = path.findIndex(p => p.x === pos.x && p.y === pos.y);
                if (pIdx !== -1) {
                    let removed = path.splice(pIdx + 1);
                    removed.forEach(r => {
                        let rIdx = r.y * STATE.gridSize + r.x;
                        if (!STATE.grid[rIdx].isEndpoint) {
                            STATE.grid[rIdx] = null;
                        }
                    });
                }
            }
            // If target is endpoint of same color
            else if (targetCell.isEndpoint && targetCell.colorId === STATE.activeColorId) {
                // Ensure we don't connect start to start immediately
                if (path.length > 1 || (pos.x !== path[0].x || pos.y !== path[0].y)) {
                    path.push({x: pos.x, y: pos.y});
                    playSound('connect');
                    spawnParticles(pos.x, pos.y, CONFIG.colors[STATE.activeColorId], 10);
                    STATE.isDrawing = false; // Stop drawing when connected
                    checkWin();
                }
            }
            // Overwriting another color's path
            else if (targetCell.colorId !== STATE.activeColorId && !targetCell.isEndpoint) {
                // Break the other path
                let otherPath = STATE.paths[targetCell.colorId];
                let oIdx = otherPath.findIndex(p => p.x === pos.x && p.y === pos.y);
                if (oIdx !== -1) {
                    let removed = otherPath.splice(oIdx);
                    removed.forEach(r => {
                        let rIdx = r.y * STATE.gridSize + r.x;
                        if (!STATE.grid[rIdx].isEndpoint) {
                            STATE.grid[rIdx] = null;
                        }
                    });
                }

                // Add to our path
                path.push({x: pos.x, y: pos.y});
                STATE.grid[idx] = { colorId: STATE.activeColorId, isEndpoint: false, pathId: STATE.activeColorId };
                playSound('click');
            }
        }
    }
};

const handleEnd = (e) => {
    STATE.isDrawing = false;
    checkWin();
};

canvas.addEventListener('touchstart', handleStart, {passive: false});
canvas.addEventListener('touchmove', handleMove, {passive: false});
canvas.addEventListener('touchend', handleEnd);
canvas.addEventListener('mousedown', handleStart);
window.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);

// ==== GAME LOGIC ====
const spawnParticles = (gx, gy, color, count) => {
    const c = getCellCoords(gx, gy);
    for (let i = 0; i < count; i++) {
        particles.push({
            x: c.cx,
            y: c.cy,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            size: Math.random() * 5 + 2,
            color: color
        });
    }
};

const checkWin = () => {
    if (STATE.solved) return;

    // Check if all endpoints connected
    let allConnected = true;
    for(let i=0; i<STATE.endpoints.length; i+=2) {
        let ep1 = STATE.endpoints[i];
        let ep2 = STATE.endpoints[i+1];
        let p = STATE.paths[ep1.colorId];

        if (p.length < 2) { allConnected = false; break; }

        let pStart = p[0], pEnd = p[p.length-1];
        let connects = ((pStart.x === ep1.x && pStart.y === ep1.y && pEnd.x === ep2.x && pEnd.y === ep2.y) ||
                        (pEnd.x === ep1.x && pEnd.y === ep1.y && pStart.x === ep2.x && pStart.y === ep2.y));
        if (!connects) { allConnected = false; break; }
    }

    if (!allConnected) return;

    // Check if grid is fully filled
    let allFilled = true;
    for(let i=0; i<STATE.grid.length; i++) {
        if (STATE.grid[i] === null) {
            allFilled = false;
            break;
        }
    }

    if (allConnected && allFilled) {
        STATE.solved = true;
        playSound('win');

        // Massive celebration particles
        STATE.endpoints.forEach(ep => {
            spawnParticles(ep.x, ep.y, CONFIG.colors[ep.colorId], 20);
        });

        const celebText = document.getElementById('celebration-text');
        celebText.classList.add('active');

        // Rewards
        const reward = CONFIG.baseScore + (STATE.gridSize * 2);
        STATE.coins += reward;
        STATE.level++;
        saveState();
        updateUI();

        setTimeout(() => {
            celebText.classList.remove('active');
            initLevel();
        }, 2500);
    }
};

// ==== UI & NAVIGATION ====
const updateUI = () => {
    document.getElementById('coin-display').innerText = STATE.coins;

    const sToggle = document.getElementById('toggle-sound');
    if (STATE.sound) sToggle.classList.add('on');
    else sToggle.classList.remove('on');

    const mToggle = document.getElementById('toggle-music');
    if (STATE.music) mToggle.classList.add('on');
    else mToggle.classList.remove('on');
};

const showScreen = (id) => {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(`${id}-screen`).classList.remove('hidden');
    STATE.screen = id;

    if (id === 'game') {
        initLevel();
        renderLoop = requestAnimationFrame(render);
    } else {
        cancelAnimationFrame(renderLoop);
    }
};

// Event Listeners for UI
document.getElementById('btn-play').addEventListener('click', () => {
    playSound('click');
    showScreen('game');
    manageBGM();
});

document.getElementById('btn-back').addEventListener('click', () => {
    playSound('click');
    showScreen('home');
});

document.getElementById('btn-settings').addEventListener('click', () => {
    playSound('click');
    document.getElementById('settings-panel').classList.toggle('open');
});

// Close settings when clicking outside
document.addEventListener('click', (e) => {
    const panel = document.getElementById('settings-panel');
    const btn = document.getElementById('btn-settings');
    if (!panel.contains(e.target) && !btn.contains(e.target) && panel.classList.contains('open')) {
        panel.classList.remove('open');
    }
});

document.getElementById('toggle-sound').addEventListener('click', () => {
    STATE.sound = !STATE.sound;
    updateUI();
    saveState();
    playSound('click');
});

document.getElementById('toggle-music').addEventListener('click', () => {
    STATE.music = !STATE.music;
    updateUI();
    saveState();
    manageBGM();
    playSound('click');
});

window.addEventListener('resize', () => {
    if (STATE.screen === 'game') resizeCanvas();
});

// ==== BACKGROUND ANIMATION ====
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d', { alpha: false });
let bgParticles = [];

const resizeBg = () => {
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
};
window.addEventListener('resize', resizeBg);
resizeBg();

for(let i=0; i<30; i++) {
    bgParticles.push({
        x: Math.random() * bgCanvas.width,
        y: Math.random() * bgCanvas.height,
        s: Math.random() * 3 + 1,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        a: Math.random() * 0.5 + 0.1
    });
}

const animateBg = () => {
    // Semi-transparent clear for trailing effect
    bgCtx.fillStyle = 'rgba(10, 31, 17, 0.2)';
    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

    bgCtx.fillStyle = 'rgba(46, 230, 106, 0.5)';
    bgParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = bgCanvas.width;
        if (p.x > bgCanvas.width) p.x = 0;
        if (p.y < 0) p.y = bgCanvas.height;
        if (p.y > bgCanvas.height) p.y = 0;

        bgCtx.beginPath();
        bgCtx.arc(p.x, p.y, p.s, 0, Math.PI*2);
        bgCtx.fill();
    });

    requestAnimationFrame(animateBg);
};

// ==== INIT ====
const boot = () => {
    loadState();
    animateBg();

    // Add touch-action none to body to prevent refresh pull
    document.body.style.touchAction = 'none';
};

// Wait for interaction to start audio context
document.body.addEventListener('click', () => {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}, {once: true});
document.body.addEventListener('touchstart', () => {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}, {once: true});

window.onload = boot;

</script>
</body>
